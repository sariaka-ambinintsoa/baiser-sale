version: "3.9"

services:
    back_web:
        image: nginx:latest
        container_name: back_web
        ports:
            - "8080:80"
        volumes:
            - ./back/source:/var/www
            - ./back/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        links:
            - back_php

        networks:
            - bs_default    

    back_php:
        container_name: back_php
        build: ./back/docker/php
        volumes:
            - ./back/source:/var/www

        networks:
            - bs_default    

     # MySQL database service
    db:
        image: mysql:5.7
        container_name: mysql-db
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app
            MYSQL_USER: app
            MYSQL_PASSWORD: root
        
        networks:
            - bs_default

networks:
    bs_default:
        driver: bridge            
