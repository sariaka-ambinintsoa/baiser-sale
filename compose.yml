version: "3.9"

services:
    back-web:
        build: back/docker/nginx
        container_name: bs-nginx
        ports:
            - "8080:80"
        volumes:
            - ./back/source:/var/www
            - ./back/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        links:
            - back-php

        networks:
            - bs_default    

    back-php:
        container_name: bs-php
        build: back/docker/php
        volumes:
            - ./back/source:/var/www

        networks:
            - bs_default    

     # MySQL database service
    db:
        image: mysql:5.7
        container_name: bs_mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: app
            MYSQL_USER: user
            MYSQL_PASSWORD: root
        
        networks:
            - bs_default

networks:
    bs_default:
        driver: bridge            
